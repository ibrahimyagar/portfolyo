name: Check Format
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install
        run: npm install

      - name: Check Format
        run: npm run check-format
